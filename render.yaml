databases:
  - name: student-reminder-db
    plan: free
    databaseName: student_reminder_db
    user: student_reminder_db_user

services:
  - type: web
    name: student-reminder-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: student-reminder-db
          property: connectionString
