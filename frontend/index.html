<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Class reminders: tasks, performance tasks, reviewers, calendar and events." />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Class Reminders</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('sr-theme');
          var s = raw ? JSON.parse(raw) : null;
          var id = s && s.preset ? s.preset : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'classic';
          document.documentElement.setAttribute('data-theme', id);
          if (id === 'custom' && s) {
            document.documentElement.style.setProperty('--color-primary', s.primaryRgb);
            document.documentElement.style.setProperty('--color-accent', s.accentRgb);
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'classic');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
